<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Humanize</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <nav>
    <a href="index.html" class="logo">Humanize</a>
  </nav>
  <div class="glow-blob"></div>
  <div class="auth-container">
    <div class="glass-panel auth-box">
      <h2 id="authTitle">Create Account</h2>
      <p id="authSubtitle">Join Humanize for free.</p>
      
      <div id="errorMsg" class="error-message"></div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="you@example.com" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>

      <button id="authBtn" class="btn btn-primary">Sign Up</button>
      
      <div class="switch-auth">
        <span id="switchText">Already have an account?</span> 
        <a href="#" id="switchLink">Log In</a>
      </div>
    </div>
  </div>

  <script src="auth.js"></script>
</body>
</html>
